[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "injecteval"
version = "0.1.0"
description = "A small, reproducible harness for evaluating indirect prompt injection against tool-using LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Roei Duenyas" }]
keywords = ["llm", "security", "prompt-injection", "red-teaming", "evaluation", "agents"]
dependencies = ["pyyaml>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
injecteval = "injecteval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/injecteval"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/injecteval/report.py" = ["E501"]  # HTML and Markdown templates

[tool.pytest.ini_options]
testpaths = ["tests"]
