name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Scenarios and graders are self-consistent
        run: injecteval validate

  smoke:
    name: End-to-end run with the scripted agent
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: A robust agent passes the gate
        run: injecteval run --model mock:robust --fail-above 0 --out reports/robust
      - name: A vulnerable agent is caught by the gate
        run: |
          if injecteval run --model mock:vulnerable --fail-above 0 --out reports/vulnerable; then
            echo "expected the gate to fail for a vulnerable agent" && exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: example-reports
          path: reports/
